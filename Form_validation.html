
<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        form {
            width: 350px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            box-sizing: border-box;
        }

        span {
            color: red;
        }

        button {
            width: 100%;
            padding: 10px;
            background: blue;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<form onsubmit="return validateForm()">

    <h2>Registration Form</h2>

    Name:
    <input type="text" id="name">
    <span id="nameErr"></span><br><br>

    Email:
    <input type="text" id="email">
    <span id="emailErr"></span><br><br>

    Password:
    <input type="password" id="pass">
    <span id="passErr"></span><br><br>

    Confirm Password:
    <input type="password" id="cpass">
    <span id="cpassErr"></span><br><br>

    Age:
    <input type="text" id="age">
    <span id="ageErr"></span><br><br>

    Gender:<br>
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female
    <span id="genderErr"></span><br><br>

    Hobbies:<br>
    <input type="checkbox" name="hobby" value="Reading"> Reading
    <input type="checkbox" name="hobby" value="Music"> Music
    <input type="checkbox" name="hobby" value="Sports"> Sports
    <span id="hobbyErr"></span><br><br>

    <button type="submit">Register</button>

</form>

<script>
function validateForm() {

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let pass = document.getElementById("pass").value;
    let cpass = document.getElementById("cpass").value;
    let age = document.getElementById("age").value;

    let gender = document.querySelector('input[name="gender"]:checked');
    let hobby = document.querySelector('input[name="hobby"]:checked');

    let valid = true;



    if (name == "") {
        document.getElementById("nameErr").innerHTML = "Enter name";
        valid = false;
    }

    if (email == "") {
        document.getElementById("emailErr").innerHTML = "Enter email";
        valid = false;
    }

    if (pass == "") {
        document.getElementById("passErr").innerHTML = "Enter password";
        valid = false;
    }

    if (cpass == "") {
        document.getElementById("cpassErr").innerHTML = "Confirm password";
        valid = false;
    }
    else if (pass != cpass) {
        document.getElementById("cpassErr").innerHTML = "Password does not match";
        valid = false;
    }

    if (age == "") {
        document.getElementById("ageErr").innerHTML = "Enter age";
        valid = false;
    }

    if (gender == null) {
        document.getElementById("genderErr").innerHTML = "Select gender";
        valid = false;
    }

    if (hobby == null) {
        document.getElementById("hobbyErr").innerHTML = "Select a hobby";
        valid = false;
    }

    if (valid == true) {
        alert("Registration Successful!");
    }

    return valid;
}
</script>

</body>
</html>
